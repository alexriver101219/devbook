<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBook - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-dark text-white">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow-lg text-white" style="max-width: 400px; width: 100%; background-color: #1e293b; border: 1px solid #334155;">
            <h3 class="text-center mb-4 text-bright">Iniciar Sesión</h3>
            
            <div id="alert-box" class="alert d-none"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control bg-dark text-white border-secondary" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control bg-dark text-white border-secondary" placeholder="Tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Ingresar</button>
            </form>
            <p class="text-center mt-3 text-muted">¿No tienes cuenta? <a href="register.html" class="text-info">Regístrate</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alert-box');

            try {
                const res = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = '¡Bienvenido! Redirigiendo a la página principal...';
                    alertBox.classList.remove('d-none');
                    setTimeout(() => window.location.href = 'index.html', 1500);
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = data.error || 'Credenciales incorrectas';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'No se pudo conectar con el servidor backend (puerto 3000)';
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
