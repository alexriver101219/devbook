
name: Publicar Reporte Original OWASP ZAP

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  preparar_reporte:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar informe ZAP
        run: |
          mkdir -p public

          INFORME="2026-11-05-ZAP-Report-.html"
          RECURSOS="2026-11-05-ZAP-Report-"

          if [ ! -f "$INFORME" ]; then
            echo "ERROR: No se encontró el HTML original."
            exit 1
          fi

          if [ ! -d "$RECURSOS" ]; then
            echo "ERROR: No se encontró la carpeta de recursos."
            exit 1
          fi

          cp "$INFORME" public/index.html
          cp -R "$RECURSOS" public/

          echo "Informe original preparado correctamente."

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  publicar:
    needs: preparar_reporte
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
