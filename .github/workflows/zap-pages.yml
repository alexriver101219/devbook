
name: Publicar Reporte OWASP ZAP

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  preparar_reporte:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar informe ZAP
        run: |
          mkdir -p public

          if [ ! -f "backend/ZAP-Report-.html" ]; then
            echo "ERROR: No se encontró backend/ZAP-Report-.html"
            exit 1
          fi

          cp "backend/ZAP-Report-.html" public/index.html

          echo "Informe ZAP preparado correctamente."

      - name: Cargar artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  publicar:
    needs: preparar_reporte
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar informe
        id: deployment
        uses: actions/deploy-pages@v4
