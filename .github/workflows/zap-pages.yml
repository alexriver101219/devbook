name: Publicar Reporte OWASP ZAP

on:
  workflow_dispatch:

jobs:
  deploy_zap_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Preparar carpeta para GitHub Pages y buscar reporte
        run: |
          mkdir -p public
          echo "--- Contenido de la carpeta backend ---"
          ls -la backend/
          
          # Busca cualquier archivo HTML que empiece por zap o ZAP en backend y lo copia
          if ls backend/[zZ][aA][pP]*.html 1> /dev/null 2>&1; then
            cp backend/[zZ][aA][pP]*.html public/index.html
            echo "¡Reporte encontrado y copiado exitosamente como index.html!"
          else
            echo "<html><body><h1>Error: No se encontró ningún archivo ZAP en backend</h1></body></html>" > public/index.html
          fi

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: deploy_zap_report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Desplegar en GitHub Pages
        uses: actions/deploy-pages@v4