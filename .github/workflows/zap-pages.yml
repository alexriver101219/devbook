name: Publicar Reporte OWASP ZAP

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub Actions

jobs:
  deploy_zap_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Preparar carpeta para GitHub Pages
        run: |
          mkdir -p public
          # Busca el reporte dentro de la carpeta backend/ de forma flexible
          if [ -f "backend/ZAP-Report-.html" ]; then
            cp backend/ZAP-Report-.html public/index.html
            echo "¡Reporte encontrado en backend y copiado con éxito!"
          elif ls backend/ZAP*.html 1> /dev/null 2>&1; then
            cp backend/ZAP*.html public/index.html
            echo "¡Reporte ZAP con comodín encontrado en backend!"
          else
            echo "<html><body><h1>No se encontró el archivo ZAP-Report-.html en backend</h1></body></html>" > public/index.html
          fi

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: deploy_zap_report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Desplegar en GitHub Pages
        uses: actions/deploy-pages@v4