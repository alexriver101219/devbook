
name: Publicar Reporte Original OWASP ZAP

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  preparar_reporte:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar informes ZAP y K6
        run: |
          mkdir -p public/backend

          INFORME="2026-11-05-ZAP-Report-.html"
          RECURSOS="2026-11-05-ZAP-Report-"

          if [ ! -f "$INFORME" ]; then
            echo "ERROR: No se encontro el HTML de ZAP."
            exit 1
          fi

          if [ ! -d "$RECURSOS" ]; then
            echo "ERROR: No se encontro la carpeta de recursos ZAP."
            exit 1
          fi

          cp "$INFORME" public/index.html
          cp -R "$RECURSOS" public/

          echo "Reporte ZAP preparado correctamente."

          if [ ! -f backend/reporte_k6.html ]; then
            echo "ERROR: No se encontro el reporte K6."
            exit 1
          fi

          cp backend/reporte_k6.html public/backend/reporte_k6.html

          echo "Reporte K6 preparado correctamente."

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  publicar:
    needs: preparar_reporte
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
