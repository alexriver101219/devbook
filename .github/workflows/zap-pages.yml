
name: Publicar Reportes DevBook

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar reportes
        shell: bash
        run: |
          set -e
          mkdir -p public/backend

          test -f 2026-11-05-ZAP-Report-.html
          test -d 2026-11-05-ZAP-Report-
          test -f backend/reporte_k6.html

          cp 2026-11-05-ZAP-Report-.html public/
          cp -R 2026-11-05-ZAP-Report- public/
          cp backend/reporte_k6.html public/backend/

          cat > public/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>DevBook - Informes de Calidad</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                background: #f1f5f9;
                text-align: center;
                padding: 70px 15px;
              }
              main {
                background: white;
                max-width: 650px;
                margin: auto;
                padding: 35px;
                border-radius: 15px;
              }
              h1 { color: #047857; }
              a {
                display: block;
                padding: 18px;
                margin: 18px auto;
                background: #047857;
                color: white;
                border-radius: 9px;
                text-decoration: none;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>DevBook</h1>
              <h2>Informes de Calidad del Software</h2>
              <p>Proyecto SENA - ADSO</p>
              <a href="./backend/reporte_k6.html">
                Ver reporte de rendimiento K6
              </a>
              <a href="./2026-11-05-ZAP-Report-.html">
                Ver reporte de seguridad OWASP ZAP
              </a>
            </main>
          </body>
          </html>
          HTML

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir reportes
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
