<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado del pago - DevBook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-dark text-white">
    <main class="container d-flex justify-content-center align-items-center min-vh-100">
        <section class="card p-4 shadow-lg text-white" style="max-width: 520px; width: 100%; background-color: #1e293b; border: 1px solid #334155;">
            <h1 class="h3 mb-3">Estado de tu compra</h1>
            <p id="payment-message" role="status" aria-live="polite">Verificando el pago con Mercado Pago...</p>
            <a id="download-book" class="btn btn-primary mb-3" href="#" hidden>Descargar guía PDF</a>
            <button id="retry-verification" type="button" class="btn btn-outline-light mb-3" hidden>Volver a verificar</button>
            <a class="text-info" href="index.html">Volver a DevBook</a>
        </section>
    </main>
    <script>
        const apiBaseUrl = window.location.protocol === 'https:'
            ? ''
            : `http://${window.location.hostname || 'localhost'}:5000`;
        const params = new URLSearchParams(window.location.search);
        const paymentId = params.get('payment_id') || params.get('collection_id');
        const message = document.getElementById('payment-message');
        const download = document.getElementById('download-book');
        const retry = document.getElementById('retry-verification');

        async function verifyPayment() {
            if (!paymentId) {
                message.textContent = 'No se recibió un identificador de pago. Si completaste el pago, inicia sesión y contacta al administrador para verificarlo.';
                retry.hidden = true;
                return;
            }

            retry.disabled = true;
            message.textContent = 'Verificando el pago directamente con Mercado Pago...';
            try {
                const response = await fetch(`${apiBaseUrl}/api/book/confirm`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ payment_id: paymentId })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'No se pudo verificar el pago.');
                if (data.purchased) {
                    message.textContent = 'Pago aprobado. La guía ya está disponible en tu cuenta.';
                    download.href = `${apiBaseUrl}/api/book/download`;
                    download.hidden = false;
                    retry.hidden = true;
                } else if (data.status === 'pending' || data.status === 'in_process') {
                    message.textContent = 'Mercado Pago todavía no confirma el pago. Puedes volver a verificar en unos momentos.';
                    retry.hidden = false;
                } else {
                    message.textContent = `El pago no fue aprobado (estado: ${data.status}). No se habilitó la descarga.`;
                    retry.hidden = true;
                }
            } catch (error) {
                message.textContent = error.message;
                retry.hidden = false;
            } finally {
                retry.disabled = false;
            }
        }

        retry.addEventListener('click', verifyPayment);
        verifyPayment();
    </script>
</body>
</html>
