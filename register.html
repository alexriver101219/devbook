<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBook - Crear Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-dark text-white">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow-lg text-white" style="max-width: 420px; width: 100%; background-color: #1e293b; border: 1px solid #334155;">
            <h3 class="text-center mb-4 text-bright">Crear Cuenta</h3>
            
            <div id="alert-box" class="alert d-none"></div>

            <form id="registerForm">
                <div class="mb-3">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" id="name" class="form-control bg-dark text-white border-secondary" placeholder="Tu nombre" required maxlength="100">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input type="email" id="email" class="form-control bg-dark text-white border-secondary" placeholder="ejemplo@correo.com" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" class="form-control bg-dark text-white border-secondary" placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                    <input type="password" id="confirmPassword" class="form-control bg-dark text-white border-secondary" placeholder="Repite tu contraseña" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Registrarse</button>
            </form>
            <p class="text-center mt-3 text-muted">¿Ya tienes una cuenta? <a href="login.html" class="text-info">Inicia Sesión</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nombre = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertBox = document.getElementById('alert-box');
            const apiBaseUrl = window.location.protocol === 'https:'
                ? ''
                : `http://${window.location.hostname || 'localhost'}:5000`;

            if (password !== confirmPassword) {
                alertBox.className = 'alert alert-warning';
                alertBox.textContent = 'Las contraseñas no coinciden.';
                alertBox.classList.remove('d-none');
                return;
            }

            try {
                const res = await fetch(`${apiBaseUrl}/api/register`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, correo: email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = '¡Cuenta creada con éxito! Redirigiendo al inicio de sesión...';
                    alertBox.classList.remove('d-none');
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    alertBox.className = 'alert alert-danger';
                    alertBox.textContent = data.error || 'Ocurrió un error al registrar el usuario.';
                    alertBox.classList.remove('d-none');
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'No se pudo conectar con el servidor backend.';
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
