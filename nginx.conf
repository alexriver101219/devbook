server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-PD3cvoL+rF/6OWPZotW9K6eTrez5rFR4BJBnV6kchrE=' 'sha256-Mk8YItBbIm+dPzlluYkbp7Mn2bapZIK67/mm0/cky1s=' 'sha256-OMBS7h1lD9xTGZojRuOTH2uyn+SSjSgc5qpdEeE+PfU=' 'sha256-98gu4M9M9Svnc+H62saBpqmBlkC+Wnr/2nsBlnB5JhM='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:5000 http://127.0.0.1:5000" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ~ (^|/)\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
